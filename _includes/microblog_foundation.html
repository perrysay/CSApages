<button id="microblog-toggle-btn" class="microblog-fab" type="button" aria-label="Open Microblog" aria-controls="microblog-panel" aria-expanded="false">Microblog</button>

<aside id="microblog-panel" class="microblog-panel" tabindex="-1" aria-label="Microblog panel" aria-hidden="true">
  <div class="microblog-panel-header">
    <div class="microblog-panel-heading">
      <p class="microblog-eyebrow">Community</p>
      <h2 class="microblog-panel-title">Microblog</h2>
    </div>
    <div class="microblog-panel-header-actions">
      <button id="guest-signup-toggle" class="guest-signup-toggle-btn" type="button" aria-expanded="false" aria-controls="guest-signup-form">Guest signup</button>
      <button id="microblog-close-btn" class="microblog-close-btn" type="button" aria-label="Close Microblog">&times;</button>
    </div>
  </div>

  <div id="guest-signup-form" class="guest-signup-container" hidden>
    <h3 class="guest-signup-title">Quick guest signup</h3>
    <form id="guest-form" onsubmit="handleGuestSignup(event);">
      <div class="guest-form-group">
        <label for="guest-username">Username</label>
        <input type="text" id="guest-username" autocomplete="username" required>
      </div>
      <div class="guest-form-group">
        <label for="guest-password">Password</label>
        <input type="password" id="guest-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="guest-submit-btn">Sign up &amp; log in</button>
      <p id="guest-status-message" class="guest-status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="microblog-panel-content">
    <div class="microblog-feed-heading">
      <div>
        <h3>Community notes</h3>
        <p>Questions, ideas, and updates from across the site.</p>
      </div>
      <button id="create-btn" class="microblog-compose-btn" type="button">Write a post</button>
    </div>
    <div class="microblog-feed-toolbar">
      <span class="microblog-feed-label">Show</span>
      <div class="microblog-filter-controls" role="group" aria-label="Filter microblog posts">
        <button id="microblog-filter-page" class="microblog-filter-btn is-active" type="button" aria-pressed="true">This page</button>
        <button id="microblog-filter-all" class="microblog-filter-btn" type="button" aria-pressed="false">All posts</button>
      </div>
    </div>
    <div id="microblog-playground" class="microblog-feed" aria-live="polite" aria-busy="true">
      <em>Loading microblog posts...</em>
    </div>
  </div>
</aside>

<script type="module">
// Import required functions from config
import { pythonURI, fetchOptions } from '{{site.baseurl}}/assets/js/api/config.js';

// Microblog panel open/close logic
const microblogPanel = document.getElementById('microblog-panel');
const microblogFab = document.getElementById('microblog-toggle-btn');
const microblogCloseBtn = document.getElementById('microblog-close-btn');

function openMicroblogPanel() {
  microblogPanel.classList.add('open');
  microblogPanel.setAttribute('aria-hidden', 'false');
  microblogFab.setAttribute('aria-expanded', 'true');
  microblogFab.style.display = 'none';
  microblogPanel.focus();
}
function closeMicroblogPanel() {
  microblogPanel.classList.remove('open');
  microblogPanel.setAttribute('aria-hidden', 'true');
  microblogFab.setAttribute('aria-expanded', 'false');
  microblogFab.style.display = '';
  microblogFab.focus();
}
microblogFab.onclick = openMicroblogPanel;
microblogCloseBtn.onclick = closeMicroblogPanel;

// Guest signup toggle logic
const guestSignupToggle = document.getElementById('guest-signup-toggle');
const guestSignupForm = document.getElementById('guest-signup-form');

guestSignupToggle.onclick = function() {
  guestSignupForm.hidden = !guestSignupForm.hidden;
  guestSignupToggle.setAttribute('aria-expanded', String(!guestSignupForm.hidden));
};

// Guest signup handler with auto-login
window.handleGuestSignup = async function(event) {
  event.preventDefault();

  const username = document.getElementById('guest-username').value;
  const password = document.getElementById('guest-password').value;
  const statusMessage = document.getElementById('guest-status-message');
  const submitButton = document.querySelector('.guest-submit-btn');

  // Disable button and show loading state
  submitButton.disabled = true;
  submitButton.textContent = 'Creating Account...';
  statusMessage.textContent = '';
  statusMessage.style.color = '#666';

  const signupData = {
    uid: username,
    password: password
  };

  try {
    // Step 1: Try to create guest account using Flask backend
    statusMessage.textContent = 'Creating guest account...';
    const signupResponse = await fetch(`${pythonURI}/api/user/guest`, {
      ...fetchOptions,
      method: 'POST',
      body: JSON.stringify(signupData)
    });

    if (!signupResponse.ok) {
      // Account might already exist, so we'll try to login instead
      statusMessage.textContent = 'Account exists, logging in...';
    } else {
      await signupResponse.json();
      statusMessage.textContent = 'Account created! Logging in...';
    }

    // Step 2: Login with the credentials (whether account was just created or already existed)
    const loginResponse = await fetch(`${pythonURI}/api/authenticate`, {
      ...fetchOptions,
      method: 'POST',
      body: JSON.stringify(signupData)
    });

    if (!loginResponse.ok) {
      throw new Error('Login failed - please check your credentials');
    }

    await loginResponse.json();

    // Success - stay on current page
    statusMessage.textContent = 'Success! You are now logged in.';
    statusMessage.style.color = 'green';
    window.dispatchEvent(new Event('microblog:authenticated'));

    // Hide the form after successful signup/login
    setTimeout(() => {
      guestSignupForm.hidden = true;
      guestSignupToggle.setAttribute('aria-expanded', 'false');
      // Reset form
      document.getElementById('guest-username').value = '';
      document.getElementById('guest-password').value = '';
      submitButton.disabled = false;
      submitButton.textContent = 'Sign Up & Login';
    }, 2000);

  } catch (error) {
    console.error('Guest signup error:', error);
    statusMessage.textContent = `Error: ${error.message}`;
    statusMessage.style.color = 'red';
    submitButton.disabled = false;
    submitButton.textContent = 'Sign Up & Login';
  }
};
</script>

<div id="microblog-modal" class="microblog-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="microblog-modal-panel">
    <div class="microblog-modal-header">
      <h2 id="modal-title" class="microblog-modal-title">Create Microblog Post</h2>
      <button id="modal-close" class="microblog-modal-close" type="button" aria-label="Close Modal">&times;</button>
    </div>
    <form id="microblog-form" class="microblog-form">
      <input type="hidden" id="post-id" name="id">
      <div class="microblog-form-group">
        <label for="topic-id" class="microblog-form-label">Topic</label>
        <input id="topic-id" name="topicId" type="text" readonly>
      </div>
      <div class="microblog-form-group">
        <label for="content" class="microblog-form-label">Content <span class="required">*</span></label>
        <textarea id="content" name="content" required></textarea>

      <div class="microblog-form-actions">
        <button type="button" id="microblog-cancel-btn" class="microblog-btn microblog-btn-secondary">Cancel</button>

</div>

<div id="reply-modal" class="microblog-modal hidden" role="dialog" aria-modal="true" aria-labelledby="reply-modal-title">
  <div class="microblog-modal-panel">
    <div class="microblog-modal-header">
      <h2 id="reply-modal-title" class="microblog-modal-title">Reply to Post</h2>
      <button id="reply-modal-close" class="microblog-modal-close" type="button" aria-label="Close Reply Modal">&times;</button>
    </div>
    <form id="reply-form" class="microblog-form">
      <input type="hidden" id="reply-post-id" name="postId">
      <div class="microblog-form-group">
        <label for="reply-content" class="microblog-form-label">Content <span class="required">*</span></label>
        <textarea id="reply-content" name="content" required></textarea>
      </div>
      <div class="microblog-form-actions">
        <button type="button" id="reply-cancel-btn" class="microblog-btn microblog-btn-secondary">Cancel</button>
        <button type="submit" class="microblog-btn">Reply</button>
      </div>
    </form>
  </div>
</div>

<!--JavaScript Logic for MicroBlog -->
<script type="module">
// Imports for APIs used on this page
import { fetchPosts, createPost, updatePost, createReply, fetchReplies } from '/assets/js/api/microblog.js';
import { baseurl } from '{{site.baseurl}}/assets/js/api/config.js';

// Default Key for New MicroBlog Posts
const pagePermalink = '{{page.permalink}}';

// Create/Edit Modal Functions
function openModal({ mode, post = {} }) {
  document.getElementById('microblog-modal').classList.remove('hidden');
  document.getElementById('modal-title').textContent = mode === 'edit' ? 'Edit Microblog Post' : 'Create Microblog Post';
  document.getElementById('post-id').value = post.id || '';
  document.getElementById('topic-id').value = post.topicPath || pagePermalink;
  document.getElementById('content').value = post.content || '';
}
function closeModal() {
  document.getElementById('microblog-modal').classList.add('hidden');
}
document.getElementById('modal-close').onclick = closeModal;
document.getElementById('microblog-cancel-btn').onclick = closeModal;
document.getElementById('microblog-modal').onclick = function(e) {
  if (e.target === this) closeModal();
};

// Reply Modal Functions
function openReplyModal(postId) {
  document.getElementById('reply-modal').classList.remove('hidden');
  document.getElementById('reply-post-id').value = postId;
  document.getElementById('reply-content').value = '';
}
function closeReplyModal() {
  document.getElementById('reply-modal').classList.add('hidden');
  document.getElementById('reply-post-id').value = '';
  document.getElementById('reply-content').value = '';
}
document.getElementById('reply-modal-close').onclick = closeReplyModal;
document.getElementById('reply-cancel-btn').onclick = closeReplyModal;
document.getElementById('reply-modal').onclick = function(e) {
  if (e.target === this) closeReplyModal();
};

// Reply Form Submission
document.getElementById('reply-form').onsubmit = async function(e) {
  e.preventDefault();
  const submitButton = this.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = 'Saving...';
  const postId = document.getElementById('reply-post-id').value;
  const content = document.getElementById('reply-content').value;
  const topicPath = pagePermalink || (window.location ? window.location.pathname : 'default');
  
  try {
    await createReply({ postId, content, topicPath });
    closeReplyModal();
    renderMicroblogFeed(); // Refresh to show new reply
  } catch (err) {
    alert('Error posting reply: ' + err.message);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Reply';
  }
};

function formatTimestamp(timestamp) {
  if (!timestamp) return '';
  const date = new Date(timestamp);
  if (Number.isNaN(date.getTime())) return escapeHtml(timestamp);
  return `<time datetime="${date.toISOString()}">${escapeHtml(date.toLocaleString())}</time>`;
}

// Load replies for a specific post
async function loadRepliesForPost(postId) {
  const repliesContainer = [...document.querySelectorAll('.microblog-replies')]
    .find(element => element.dataset.postId === String(postId));
  if (!repliesContainer) return;

  try {
    const repliesData = await fetchReplies(postId);
    const replies = Array.isArray(repliesData?.replies)
      ? repliesData.replies
      : Array.isArray(repliesData) ? repliesData : [];
    repliesContainer.innerHTML = replies.length
      ? `<h4 class="microblog-replies-title">Replies <span>${replies.length}</span></h4>
          ${replies.map(reply => `
            <article class="microblog-reply">
              <div class="microblog-reply-meta">
                <strong>${escapeHtml(reply.userName || 'Community member')}</strong>
                ${formatTimestamp(reply.timestamp)}
              </div>
              <p class="microblog-reply-content">${escapeHtml(reply.content || '')}</p>
            </article>
          `).join('')}`
      : '<p class="microblog-no-replies">No replies yet.</p>';
  } catch (error) {
    console.error(`Error loading replies for post ${postId}:`, error);
    repliesContainer.innerHTML = '<p class="microblog-reply-error">Replies could not be loaded.</p>';
  }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[character]);
}

// Save Button Listner for Update and Create
document.getElementById('microblog-form').onsubmit = async function(e) {
  e.preventDefault();
  const submitButton = this.querySelector('button[type="submit"]');
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = 'Saving...';
  const id = document.getElementById('post-id').value;
  const topicPath = document.getElementById('topic-id').value;
  const content = document.getElementById('content').value;
  try {
    // API calls to Update and Create Posts
    if (id) {
      await updatePost({ id, content, topicPath });
    } else {
      await createPost({ content, topicPath });
    }
    closeModal();
    renderMicroblogFeed();
  } catch (err) {
    alert('Error saving post: ' + err.message);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Save';
  }
};

if (window.__microblogFilterMode === undefined) {
  window.__microblogFilterMode = 'page';
}

const pageFilterButton = document.getElementById('microblog-filter-page');
const allFilterButton = document.getElementById('microblog-filter-all');

function setFilterMode(mode) {
  window.__microblogFilterMode = mode;
  pageFilterButton.classList.toggle('is-active', mode === 'page');
  pageFilterButton.setAttribute('aria-pressed', String(mode === 'page'));
  allFilterButton.classList.toggle('is-active', mode === 'people');
  allFilterButton.setAttribute('aria-pressed', String(mode === 'people'));
  renderMicroblogFeed();
}

pageFilterButton.onclick = () => setFilterMode('page');
allFilterButton.onclick = () => setFilterMode('people');
document.getElementById('create-btn').onclick = () => openModal({ mode: 'create' });

// Microblog feed renderer
async function renderMicroblogFeed() {
  const container = document.getElementById('microblog-playground');
  container.setAttribute('aria-busy', 'true');
  try {
    const pageArg = window.__microblogFilterMode === 'page'
      ? window.location.pathname
      : undefined;
    const data = await fetchPosts(pageArg);
    const posts = Array.isArray(data.microblogs) ? data.microblogs : [];

    pageFilterButton.classList.toggle('is-active', window.__microblogFilterMode === 'page');
    pageFilterButton.setAttribute('aria-pressed', String(window.__microblogFilterMode === 'page'));
    allFilterButton.classList.toggle('is-active', window.__microblogFilterMode === 'people');
    allFilterButton.setAttribute('aria-pressed', String(window.__microblogFilterMode === 'people'));

    if (posts.length === 0) {
      container.innerHTML = `
        <div class="microblog-empty-state">
          <span class="microblog-empty-icon" aria-hidden="true">✦</span>
          <h3>No posts here yet</h3>
          <p>Start the conversation with a question, idea, or update.</p>
          <button class="microblog-btn" type="button" data-action="create">Write the first post</button>
        </div>
      `;
    } else {
      container.innerHTML = posts.map(post => {
        const author = String(post.userName || 'Community member');
        const content = String(post.content || '');
        const topicPath = String(post.topicPath || pagePermalink || '');
        const postId = escapeHtml(post.id ?? '');
        return `
          <article class="microblog-post" data-post-id="${postId}">
            <header class="microblog-post-header">
              <span class="microblog-avatar" aria-hidden="true">${escapeHtml(author.trim().charAt(0).toUpperCase() || 'M')}</span>
              <div class="microblog-author-details">
                <strong class="microblog-author">${escapeHtml(author)}</strong>
                <span class="microblog-post-date">${formatTimestamp(post.timestamp)}</span>
              </div>
              <span class="microblog-topic">${escapeHtml(topicPath)}</span>
            </header>
            <p class="microblog-post-content">${escapeHtml(content)}</p>
            <footer class="microblog-post-footer">
              <span class="microblog-character-count">${content.length} ${content.length === 1 ? 'character' : 'characters'}</span>
              <div class="microblog-post-actions">
                <button class="microblog-action-btn" type="button" data-action="edit" data-id="${postId}" aria-label="Edit post by ${escapeHtml(author)}">Edit</button>
                <button class="microblog-action-btn" type="button" data-action="reply" data-id="${postId}" aria-label="Reply to post by ${escapeHtml(author)}">Reply</button>
              </div>
            </footer>
            <section class="microblog-replies" data-post-id="${postId}" aria-label="Replies">
              <p class="microblog-no-replies">Loading replies...</p>
            </section>
          </article>
        `;
      }).join('');
    }

    container.setAttribute('aria-busy', 'false');
    container.onclick = event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'create') {
        openModal({ mode: 'create' });
        return;
      }
      const post = posts.find(item => String(item.id) === button.dataset.id);
      if (!post) return;
      if (button.dataset.action === 'edit') openModal({ mode: 'edit', post });
      if (button.dataset.action === 'reply') openReplyModal(post.id);
    };

    for (const post of posts) {
      await loadRepliesForPost(post.id);
    }
  } catch (error) {
    container.setAttribute('aria-busy', 'false');
    if (error.status === 401) {
      container.innerHTML = `
        <div class="microblog-auth-required" role="alert">
          <h3>Sign in to join the conversation</h3>
          <p>Microblog posts are available to signed-in users. Sign in, then come back to this page.</p>
          <a class="microblog-btn" href="${baseurl}/login">Sign in</a>
        </div>
      `;
      return;
    }
    container.innerHTML = `<p class="microblog-state-error" role="alert">Failed to load microblog posts: ${escapeHtml(error.message)}</p>`;
  }
}
window.addEventListener('microblog:authenticated', renderMicroblogFeed);
renderMicroblogFeed();
</script>
